<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Taller mecanico virtual</title>
  <style>
    /* colores del taller */
    body {
      font-family: Arial, sans-serif;
      background-color: #2b2b2b;
      color: #222;
      margin: 0;
      padding: 20px;
    }

    #taller {
      max-width: 700px;
      margin: 0 auto;
      background-color: #f2f2f2;
      border: 4px solid #f5a300;
      border-radius: 10px;
      padding: 20px;
    }

    h1 {
      background-color: #f5a300;
      margin: -20px -20px 20px -20px;
      padding: 15px;
      border-radius: 6px 6px 0 0;
      text-align: center;
    }

    #conversacion {
      background-color: white;
      border: 2px solid #999;
      height: 280px;
      overflow-y: scroll;
      padding: 10px;
      margin-bottom: 15px;
    }

    .pregunta {
      background-color: #ffe9b3;
      padding: 8px;
      margin: 8px 0;
      border-radius: 5px;
    }

    .respuesta {
      background-color: #d9d9d9;
      padding: 8px;
      margin: 8px 0;
      border-radius: 5px;
    }

    input[type="text"] {
      width: 60%;
      padding: 8px;
      font-size: 15px;
    }

    select, button {
      padding: 8px;
      font-size: 15px;
    }

    button {
      background-color: #f5a300;
      border: 2px solid #222;
      cursor: pointer;
    }

    #ejemplos {
      margin-top: 15px;
      font-size: 14px;
    }

    #ejemplos a {
      display: block;
      color: #0044aa;
      cursor: pointer;
      margin: 3px 0;
    }
  </style>
</head>
<body>
  <div id="taller">
    <h1>Taller mecanico virtual</h1>

    <p>Hazme preguntas sobre repuestos y mantencion de vehiculos.</p>

    <div id="conversacion"></div>

    <p>
      Version:
      <select id="modo">
        <option value="prolog">Prolog</option>
        <option value="llm">LLM</option>
      </select>
    </p>

    <input type="text" id="pregunta" placeholder="Escribe tu pregunta aqui">
    <button onclick="enviar()">Enviar</button>

    <div id="ejemplos">
      <p>Ejemplos (haz click para probar):</p>
      <a onclick="usarEjemplo(this)">¿Cada cuántos km se cambia el aceite?</a>
      <a onclick="usarEjemplo(this)">¿Sirve la bujía para un camión?</a>
      <a onclick="usarEjemplo(this)">¿Qué repuestos necesita el cambio de freno en un sedán?</a>
      <a onclick="usarEjemplo(this)">¿Debo cambiar las bujías si tengo 35000 km?</a>
    </div>
  </div>

  <script>
    // agregar una linea a la conversacion
    function agregar(texto, clase) {
      const conversacion = document.getElementById("conversacion");
      const linea = document.createElement("div");
      linea.className = clase;
      linea.textContent = texto;
      conversacion.appendChild(linea);
      conversacion.scrollTop = conversacion.scrollHeight;
      return linea;
    }

    // enviar la pregunta al servidor
    async function enviar() {
      const cuadro = document.getElementById("pregunta");
      const pregunta = cuadro.value.trim();
      const modo = document.getElementById("modo").value;
      if (pregunta == "") return;

      agregar(pregunta, "pregunta");
      cuadro.value = "";
      const linea = agregar("Pensando...", "respuesta");

      // si el servidor no responde se avisa
      try {
        const respuesta = await fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pregunta: pregunta, modo: modo })
        });
        const datos = await respuesta.json();
        linea.textContent = modo.toUpperCase() + ": " + datos.respuesta;
      } catch (error) {
        linea.textContent = "Error: no se pudo conectar con el servidor.";
      }
    }

    // poner un ejemplo en el cuadro de texto
    function usarEjemplo(enlace) {
      document.getElementById("pregunta").value = enlace.textContent;
    }

    // enviar tambien con la tecla enter
    document.getElementById("pregunta").addEventListener("keydown", function (e) {
      if (e.key === "Enter") enviar();
    });
  </script>
</body>
</html>
